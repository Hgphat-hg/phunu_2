<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vietnamese Women's Day - October 20th</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Pacifico&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>
  <canvas id="fx"></canvas>

  <main class="stage" id="stage">
    <!-- Scene 1 -->
    <section class="scene">
      <div class="card">
        <span class="heart-icon">💗</span>
        <div class="label" data-text="scene1Label"></div>
        <div class="script big">
          <span data-text="scene1Prefix"></span>
          <span class="name" data-text="recipient"></span>
        </div>
        <div class="divider"></div>
      </div>
    </section>

    <!-- Scene 2 -->
    <section class="scene">
      <div class="card">
        <span class="heart-icon">🌸</span>
        <div class="script mid" data-text="scene2Line1"></div>
        <span class="date-big" data-text="scene2Date"></span>
        <div class="divider"></div>
      </div>
    </section>

    <!-- Scene 3 -->
    <section class="scene">
      <div class="card">
        <span class="heart-icon">🌹</span>
        <p class="message" id="finalMessage"></p>
        <div class="divider"></div>
      </div>
    </section>
  </main>

  <div class="dots" id="dots"><span></span><span></span><span></span></div>

<script src="script.js"></script>
</body>
</html>
